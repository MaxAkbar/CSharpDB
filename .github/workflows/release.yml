name: Release qualification

run-name: Qualify release ${{ inputs.release_tag }} at ${{ inputs.release_commit }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New semantic release tag to create after qualification
        required: true
        type: string
      release_commit:
        description: Exact main commit to qualify and release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-release-candidate:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}

      - name: Require exact untagged main and matching package version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag is not a supported semantic version: $env:RELEASE_TAG"
          }
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw "Release commit is not a full lowercase SHA: $env:RELEASE_COMMIT"
          }

          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:RELEASE_COMMIT) {
            throw "Checked-out HEAD $head does not match $env:RELEASE_COMMIT."
          }

          [xml] $buildProps = Get-Content -Raw -LiteralPath 'src/Directory.Build.props'
          $versionNodes = @($buildProps.SelectNodes('/Project/PropertyGroup/Version'))
          if ($versionNodes.Count -ne 1) {
            throw "Expected exactly one package Version; found $($versionNodes.Count)."
          }
          $releaseVersion = $env:RELEASE_TAG.Substring(1)
          if ($versionNodes[0].InnerText.Trim() -cne $releaseVersion) {
            throw "Release tag $env:RELEASE_TAG does not match package version $($versionNodes[0].InnerText.Trim())."
          }

          $remoteMain = (& gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $remoteMain -cne $env:RELEASE_COMMIT) {
            throw "Release commit $env:RELEASE_COMMIT is not exact current main $remoteMain."
          }

          $remoteTag = @(& git ls-remote --tags origin "refs/tags/$($env:RELEASE_TAG)" "refs/tags/$($env:RELEASE_TAG)^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect remote release tag $env:RELEASE_TAG."
          }
          if ($remoteTag.Count -ne 0) {
            throw "Release tag $env:RELEASE_TAG already exists; qualification requires an untagged version."
          }

          $releaseTags = @(& gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect existing GitHub Releases."
          }
          if ($releaseTags -ccontains $env:RELEASE_TAG) {
            throw "A $env:RELEASE_TAG GitHub Release already exists."
          }

  build-and-test:
    name: Qualify release source
    needs: verify-release-candidate
    uses: ./.github/workflows/sql-release-qualification.yml
    with:
      release_version: ${{ inputs.release_tag }}
      release_commit: ${{ inputs.release_commit }}
      # v4.6.0 and v4.6.1 were tagged but never published, so v4.6.2 must
      # measure from the published v4.5.1 commit. Retain historical recovery
      # mappings for auditability.
      previous_release_ref: ${{ inputs.release_tag == 'v4.6.2' && '2f141433298bcd3137e2bcaa2930c796c4222092' || inputs.release_tag == 'v4.6.1' && '2f141433298bcd3137e2bcaa2930c796c4222092' || inputs.release_tag == 'v4.5.1' && '86e25435f3c64f47afe2a776c6b03cbe84e56858' || '' }}

  prepare-nuget:
    name: Prepare NuGet candidate
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Tag must start with v (for example v1.0.1).'
          }
          $packageFileVersion = ./scripts/Get-NuGetPackageIdentityVersion.ps1 -Version $version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_file_version=$packageFileVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Rewrite README links for NuGet
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fix-nuget-readme-links.sh
          scripts/fix-nuget-readme-links.sh "$RELEASE_TAG" \
            src/CSharpDB/README.md \
            src/CSharpDB.Observability/README.md \
            src/CSharpDB.Primitives/README.md \
            src/CSharpDB.Sql/README.md \
            src/CSharpDB.Storage/README.md \
            src/CSharpDB.ImportExport/README.md \
            src/CSharpDB.Execution/README.md \
            src/CSharpDB.Storage.Diagnostics/README.md \
            src/CSharpDB.Engine/README.md \
            src/CSharpDB.Pipelines/README.md \
            src/CSharpDB.Generators/README.md \
            src/CSharpDB.Client/README.md \
            src/CSharpDB.CodeModules/README.md \
            src/CSharpDB.Data/README.md \
            src/CSharpDB.Migration/README.md \
            src/CSharpDB.Migration.DualRun/README.md \
            src/CSharpDB.EntityFrameworkCore/README.md

      - name: Pack projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          version="${{ steps.version.outputs.version }}"
          dotnet pack src/CSharpDB.Primitives/CSharpDB.Primitives.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Observability/CSharpDB.Observability.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Sql/CSharpDB.Sql.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Storage/CSharpDB.Storage.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.ImportExport/CSharpDB.ImportExport.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Execution/CSharpDB.Execution.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Storage.Diagnostics/CSharpDB.Storage.Diagnostics.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Engine/CSharpDB.Engine.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Pipelines/CSharpDB.Pipelines.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Generators/CSharpDB.Generators.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Client/CSharpDB.Client.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.CodeModules/CSharpDB.CodeModules.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Data/CSharpDB.Data.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Migration/CSharpDB.Migration.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.Migration.DualRun/CSharpDB.Migration.DualRun.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB.EntityFrameworkCore/CSharpDB.EntityFrameworkCore.csproj -c Release -o artifacts/nuget -p:Version="$version"
          dotnet pack src/CSharpDB/CSharpDB.csproj -c Release -o artifacts/nuget -p:Version="$version"

      - name: Qualify observability package surfaces
        shell: pwsh
        run: |
          ./scripts/Test-ObservabilityNuGetPackage.ps1 `
            -FeedPath artifacts/nuget `
            -Version "${{ steps.version.outputs.version }}"

      - name: Qualify packed EF Core provider
        shell: pwsh
        run: |
          ./scripts/Test-EfCoreNuGetPackage.ps1 `
            -FeedPath artifacts/nuget `
            -Version "${{ steps.version.outputs.version }}"

      - name: Pack EF Core migration analyzer
        run: dotnet pack src/CSharpDB.EntityFrameworkCore.Tools/CSharpDB.EntityFrameworkCore.Tools.csproj -c Release -o artifacts/nuget -p:Version="${{ steps.version.outputs.version }}"

      - name: Qualify packed EF Core migration analyzer
        shell: pwsh
        run: |
          ./scripts/Test-EfCoreMigrationTool.ps1 `
            -FeedPath artifacts/nuget `
            -Version "${{ steps.version.outputs.version }}"

      - name: Qualify final NuGet dependency graph and manifest
        shell: pwsh
        run: |
          ./scripts/Test-CSharpDbNuGetReleaseGraph.ps1 `
            -FeedPath artifacts/nuget `
            -Version "${{ steps.version.outputs.version }}"

      - name: Require an unpublished NuGet candidate version
        shell: pwsh
        run: |
          ./scripts/Test-CSharpDbNuGetCandidateAbsent.ps1 `
            -ManifestPath artifacts/nuget/CSharpDB-PACKAGE-MANIFEST.json

      - name: Upload qualified NuGet candidate
        uses: actions/upload-artifact@v7
        with:
          name: nuget-candidate
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/CSharpDB-PACKAGE-MANIFEST.json
          if-no-files-found: error

  migration-archives:
    name: Migration Archive (${{ matrix.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            extension: zip
          - os: ubuntu-latest
            rid: linux-x64
            extension: tar.gz
          - os: macos-latest
            rid: osx-arm64
            extension: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish reviewed migration archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          ./scripts/Publish-CSharpDbMigrationRelease.ps1 `
            -Version $version `
            -Runtime '${{ matrix.rid }}' `
            -Configuration Release `
            -OutputRoot artifacts/migration-release

      - name: Verify migration archive and publisher checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v', ''
          $archiveName = "csharpdb-migration-tool-v$version-${{ matrix.rid }}.${{ matrix.extension }}"
          $archivePath = Join-Path 'artifacts/migration-release/archives' $archiveName
          $checksumsPath = Join-Path 'artifacts/migration-release/archives' 'SHA256SUMS.txt'

          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw "Expected migration archive was not created: $archivePath"
          }
          if (-not (Test-Path -LiteralPath $checksumsPath -PathType Leaf)) {
            throw "Expected migration checksum file was not created: $checksumsPath"
          }
          if (-not (Select-String -LiteralPath $checksumsPath -Pattern ([regex]::Escape($archiveName)) -Quiet)) {
            throw "Migration checksum file does not contain $archiveName."
          }

      - name: Upload migration archive
        uses: actions/upload-artifact@v7
        with:
          name: migration-${{ matrix.rid }}
          path: artifacts/migration-release/archives/csharpdb-migration-tool-v*.${{ matrix.extension }}
          if-no-files-found: error

  native-aot:
    name: NativeAOT (${{ matrix.os }} ${{ matrix.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib: CSharpDB.Native.so
          - os: windows-latest
            rid: win-x64
            lib: CSharpDB.Native.dll
          - os: macos-latest
            rid: osx-arm64
            lib: CSharpDB.Native.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT library
        run: dotnet publish src/CSharpDB.Native/CSharpDB.Native.csproj -c Release -r ${{ matrix.rid }}

      - name: Publish observability trim and NativeAOT smoke
        run: dotnet publish tests/CSharpDB.Observability.TrimSmoke/CSharpDB.Observability.TrimSmoke.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -o artifacts/observability-aot/${{ matrix.rid }}

      - name: Run observability trim and NativeAOT smoke
        shell: pwsh
        run: |
          $executableName = if ($IsWindows) {
            'CSharpDB.Observability.TrimSmoke.exe'
          }
          else {
            'CSharpDB.Observability.TrimSmoke'
          }
          $executable = Join-Path 'artifacts/observability-aot/${{ matrix.rid }}' $executableName
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "NativeAOT executable was not produced: $executable"
          }
          & $executable
          if ($LASTEXITCODE -ne 0) {
            throw "Observability trim and NativeAOT smoke failed with exit code $LASTEXITCODE."
          }

      - name: Verify exported symbols (Linux)
        if: runner.os == 'Linux'
        run: nm -D src/CSharpDB.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.lib }} | grep -c csharpdb_

      - name: Verify exported symbols (macOS)
        if: runner.os == 'macOS'
        run: nm -gU src/CSharpDB.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.lib }} | grep -c csharpdb_

      - name: Verify exported symbols (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw "Could not locate dumpbin.exe from the installed Visual Studio toolchain."
          }

          & $dumpbin /exports src\CSharpDB.Native\bin\Release\net10.0\${{ matrix.rid }}\publish\${{ matrix.lib }} |
            Select-String "csharpdb_"

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: src/CSharpDB.Native/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.lib }}
          if-no-files-found: error

      - name: Upload C header (once)
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: native-header
          path: src/CSharpDB.Native/csharpdb.h
          if-no-files-found: error

  api-host-observability:
    name: API observability (${{ matrix.os }} ${{ matrix.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish and qualify API observability
        shell: pwsh
        run: |
          ./scripts/Test-CSharpDbPublishedHostObservability.ps1 `
            -HostName Api `
            -Runtime '${{ matrix.rid }}'

  daemon-archives:
    name: Daemon Archives (${{ matrix.os }} ${{ matrix.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            extension: tar.gz
            executable: CSharpDB.Daemon
          - os: windows-latest
            rid: win-x64
            extension: zip
            executable: CSharpDB.Daemon.exe
          - os: macos-latest
            rid: osx-arm64
            extension: tar.gz
            executable: CSharpDB.Daemon

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish daemon archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/Publish-CSharpDbDaemonRelease.ps1 -Version $env:RELEASE_TAG -Runtime ${{ matrix.rid }} -OutputRoot artifacts/daemon-release

      - name: Verify daemon archive and smoke start
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v', ''
          $archiveName = "csharpdb-daemon-v$version-${{ matrix.rid }}.${{ matrix.extension }}"
          $archivePath = Join-Path "artifacts/daemon-release/archives" $archiveName
          $checksumsPath = Join-Path "artifacts/daemon-release/archives" "SHA256SUMS.txt"

          if (-not (Test-Path -Path $archivePath)) {
            throw "Expected daemon archive was not created: $archivePath"
          }

          if (-not (Select-String -Path $checksumsPath -Pattern ([regex]::Escape($archiveName)) -Quiet)) {
            throw "Checksum file does not contain $archiveName."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "csharpdb-daemon-extract"
          if (Test-Path -Path $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot | Out-Null

          if ($archiveName.EndsWith('.zip', [StringComparison]::OrdinalIgnoreCase)) {
            Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force
          }
          else {
            & tar -xzf $archivePath -C $extractRoot
            if ($LASTEXITCODE -ne 0) {
              throw "tar extraction failed with exit code $LASTEXITCODE."
            }
          }

          $executablePath = Join-Path $extractRoot "${{ matrix.executable }}"
          if (-not (Test-Path -Path $executablePath)) {
            throw "Expected daemon executable was not found after extraction: $executablePath"
          }

          if (-not $IsWindows) {
            & chmod +x $executablePath
          }

          ./scripts/Test-CSharpDbPublishedHostObservability.ps1 `
            -HostName Daemon `
            -Runtime '${{ matrix.rid }}' `
            -ExecutablePath $executablePath `
            -WorkingDirectory $extractRoot

          $outPath = Join-Path $env:RUNNER_TEMP "csharpdb-daemon-smoke.out.log"
          $errPath = Join-Path $env:RUNNER_TEMP "csharpdb-daemon-smoke.err.log"
          $dbPath = Join-Path $env:RUNNER_TEMP "csharpdb-daemon-smoke.db"
          $env:DOTNET_ENVIRONMENT = 'Production'
          $env:ASPNETCORE_ENVIRONMENT = 'Production'
          $env:ASPNETCORE_URLS = 'http://127.0.0.1:5820'
          $env:ConnectionStrings__CSharpDB = "Data Source=$dbPath"
          $env:CSharpDB__Daemon__EnableRestApi = 'true'

          $process = Start-Process `
            -FilePath $executablePath `
            -WorkingDirectory $extractRoot `
            -PassThru `
            -RedirectStandardOutput $outPath `
            -RedirectStandardError $errPath

          $info = $null
          $deadline = [DateTimeOffset]::UtcNow.AddSeconds(30)
          while ([DateTimeOffset]::UtcNow -lt $deadline) {
            if ($process.HasExited) {
              Write-Host "--- stdout ---"
              if (Test-Path $outPath) { Get-Content $outPath }
              Write-Host "--- stderr ---"
              if (Test-Path $errPath) { Get-Content $errPath }
              throw "Daemon smoke process exited early with code $($process.ExitCode)."
            }

            try {
              $info = Invoke-RestMethod -Uri 'http://127.0.0.1:5820/api/info' -TimeoutSec 2
              break
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }

          if ($null -eq $info) {
            Write-Host "--- stdout ---"
            if (Test-Path $outPath) { Get-Content $outPath }
            Write-Host "--- stderr ---"
            if (Test-Path $errPath) { Get-Content $errPath }
            throw "Daemon REST smoke endpoint did not respond before the timeout."
          }

          if ([string]::IsNullOrWhiteSpace($info.dataSource)) {
            throw "Daemon REST smoke endpoint returned no dataSource."
          }

          $grpcSmokeRoot = Join-Path $env:RUNNER_TEMP "csharpdb-daemon-grpc-smoke"
          if (Test-Path -Path $grpcSmokeRoot) {
            Remove-Item -LiteralPath $grpcSmokeRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $grpcSmokeRoot | Out-Null

          $clientProjectPath = (Resolve-Path "src/CSharpDB.Client/CSharpDB.Client.csproj").Path
          $grpcSmokeProject = Join-Path $grpcSmokeRoot "CSharpDbDaemonGrpcSmoke.csproj"
          $grpcSmokeProgram = Join-Path $grpcSmokeRoot "Program.cs"

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$clientProjectPath" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Path $grpcSmokeProject -Encoding UTF8

          @"
          using CSharpDB.Client;

          await using var client = CSharpDbClient.Create(new CSharpDbClientOptions
          {
              Transport = CSharpDbTransport.Grpc,
              Endpoint = args[0],
          });

          var info = await client.GetInfoAsync();
          if (string.IsNullOrWhiteSpace(info.DataSource))
              throw new InvalidOperationException("Daemon gRPC smoke returned no data source.");

          Console.WriteLine(info.DataSource);
          "@ | Set-Content -Path $grpcSmokeProgram -Encoding UTF8

          & dotnet run --project $grpcSmokeProject --configuration Release -- 'http://127.0.0.1:5820'
          if ($LASTEXITCODE -ne 0) {
            throw "Daemon gRPC smoke client failed with exit code $LASTEXITCODE."
          }

          $process.Kill($true)
          $process.WaitForExit()

      - name: Upload daemon archive
        uses: actions/upload-artifact@v7
        with:
          name: daemon-${{ matrix.rid }}
          path: |
            artifacts/daemon-release/archives/*.zip
            artifacts/daemon-release/archives/*.tar.gz
          if-no-files-found: error

  admin-desktop-archive:
    name: Admin Desktop Archive (win-x64)
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish Admin desktop archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/Publish-CSharpDbAdminRelease.ps1 -Version $env:RELEASE_TAG -Runtime win-x64 -OutputRoot artifacts/admin-release

      - name: Verify Admin desktop archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v', ''
          $archiveName = "csharpdb-admin-desktop-v$version-win-x64.zip"
          $archivePath = Join-Path 'artifacts/admin-release/archives' $archiveName
          $checksumPath = 'artifacts/admin-release/archives/ADMIN-SHA256SUMS.txt'

          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw "Expected Admin desktop archive was not created: $archivePath"
          }

          if (-not (Select-String -Path $checksumPath -Pattern ([regex]::Escape($archiveName)) -Quiet)) {
            throw "Admin checksum file does not contain $archiveName."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'csharpdb-admin-desktop-extract'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractRoot -Force

          foreach ($requiredPath in @(
              (Join-Path $extractRoot 'CSharpDB.Admin.Desktop.exe'),
              (Join-Path $extractRoot 'admin/CSharpDB.Admin.exe'),
              (Join-Path $extractRoot 'admin/wwwroot/help/index.html'))) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required Admin desktop release file is missing: $requiredPath"
            }
          }

      - name: Upload Admin desktop archive
        uses: actions/upload-artifact@v7
        with:
          name: admin-desktop-win-x64
          path: |
            artifacts/admin-release/archives/*.zip
            artifacts/admin-release/archives/ADMIN-SHA256SUMS.txt
          if-no-files-found: error

  prepare-release-bundle:
    name: Prepare final release bundle
    needs: [prepare-nuget, migration-archives, native-aot, api-host-observability, daemon-archives, admin-desktop-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-candidate
          path: artifacts/release-bundle/nuget

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/release-bundle/native
          merge-multiple: true

      - name: Download migration artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: migration-*
          path: artifacts/release-bundle/migration
          merge-multiple: true

      - name: Download daemon artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: daemon-*
          path: artifacts/release-bundle/daemon
          merge-multiple: true

      - name: Download Admin desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: admin-desktop-win-x64
          path: artifacts/release-bundle/admin-desktop

      - name: Generate daemon checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release-bundle/daemon
          sha256sum csharpdb-daemon-v* > SHA256SUMS.txt

      - name: Generate migration checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release-bundle/migration
          sha256sum csharpdb-migration-tool-v* > MIGRATION-SHA256SUMS.txt

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f RELEASE_NOTES.md ]]; then
            notes_file="artifacts/release-bundle/release-notes-current.md"
            awk '
              /^## / {
                if (started) exit
                started=1
              }
              started { print }
            ' RELEASE_NOTES.md > "$notes_file"

            if [[ -s "$notes_file" ]]; then
              echo "has_notes=true" >> "$GITHUB_OUTPUT"
              echo "path=$notes_file" >> "$GITHUB_OUTPUT"
            else
              echo "has_notes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify complete immutable release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ steps.notes.outputs.has_notes }}' -cne 'true') {
            throw 'RELEASE_NOTES.md must contain a current release section.'
          }
          $expectedHeading = "## CSharpDB ${{ needs.prepare-nuget.outputs.version }}"
          $actualHeading = Get-Content -LiteralPath `
            artifacts/release-bundle/release-notes-current.md |
            Select-Object -First 1
          if ($actualHeading -cne $expectedHeading) {
            throw "Release notes begin with '$actualHeading'; expected '$expectedHeading'."
          }
          $requiredPatterns = @(
            'nuget/*.nupkg',
            'nuget/CSharpDB-PACKAGE-MANIFEST.json',
            'native/*',
            'migration/csharpdb-migration-tool-v*',
            'migration/MIGRATION-SHA256SUMS.txt',
            'daemon/csharpdb-daemon-v*',
            'daemon/SHA256SUMS.txt',
            'admin-desktop/*.zip',
            'admin-desktop/ADMIN-SHA256SUMS.txt',
            'release-notes-current.md'
          )
          foreach ($pattern in $requiredPatterns) {
            if (@(Get-ChildItem -Path (Join-Path 'artifacts/release-bundle' $pattern) -File).Count -eq 0) {
              throw "Release bundle is missing required content: $pattern"
            }
          }
          ./scripts/Test-CSharpDbNuGetReleaseGraph.ps1 `
            -FeedPath artifacts/release-bundle/nuget `
            -Version '${{ needs.prepare-nuget.outputs.version }}' `
            -ValidateExistingManifest
          ./scripts/Test-CSharpDbNuGetCandidateAbsent.ps1 `
            -ManifestPath artifacts/release-bundle/nuget/CSharpDB-PACKAGE-MANIFEST.json

      - name: Upload final release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: artifacts/release-bundle
          if-no-files-found: error
          retention-days: 90
