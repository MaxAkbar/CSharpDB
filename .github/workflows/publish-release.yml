name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-tag:
    name: Publish exact release tag
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_commit: ${{ github.sha }}
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
