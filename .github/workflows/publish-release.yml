name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  statuses: read
  id-token: write

jobs:
  publish:
    name: Publish exact release tag
    permissions:
      contents: write
      statuses: read
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
