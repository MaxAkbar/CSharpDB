name: SQL Release Qualification

on:
  push:
    tags:
      - "qualification-*"
  workflow_call:
    inputs:
      release_version:
        description: Optional release tag, such as v4.4.0
        required: false
        default: ""
        type: string
      release_commit:
        description: Optional release commit paired with release_version
        required: false
        default: ""
        type: string
      previous_release_ref:
        description: Optional previous release tag or commit; empty discovers the nearest prior semantic release
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional release tag, such as v4.4.0
        required: false
        default: ""
        type: string
      release_commit:
        description: Optional release commit paired with release_version
        required: false
        default: ""
        type: string
      previous_release_ref:
        description: Optional previous release tag or commit; empty discovers the nearest prior semantic release
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} / clean pass ${{ matrix.qualification_pass }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        qualification_pass:
          - 1
          - 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Use private link-free temporary directory (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          temp_directory="$(mktemp -d /private/tmp/csharpdb-sql-release.XXXXXX)"
          chmod 700 "${temp_directory}"
          echo "TMPDIR=${temp_directory}" >> "${GITHUB_ENV}"

      - name: Run SQL release qualification
        shell: pwsh
        env:
          QUALIFICATION_OUTPUT: ${{ runner.temp }}/csharpdb-sql-release-qualification/${{ github.sha }}/${{ matrix.os }}/pass-${{ matrix.qualification_pass }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          ./scripts/Test-SqlReleaseQualification.ps1 `
            -OutputPath $env:QUALIFICATION_OUTPUT `
            -Configuration Release `
            -QualificationPass ${{ matrix.qualification_pass }} `
            -ReleaseVersion $env:RELEASE_VERSION `
            -ReleaseCommit $env:RELEASE_COMMIT

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sql-release-qualification-${{ github.sha }}-${{ matrix.os }}-pass-${{ matrix.qualification_pass }}
          path: ${{ runner.temp }}/csharpdb-sql-release-qualification/${{ github.sha }}/${{ matrix.os }}/pass-${{ matrix.qualification_pass }}/evidence
          if-no-files-found: warn
          retention-days: 14

  previous-release-performance:
    name: Windows previous-release performance / clean pass ${{ matrix.qualification_pass }}
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        qualification_pass:
          - 1
          - 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compare with previous release
        shell: pwsh
        env:
          PERFORMANCE_OUTPUT: ${{ runner.temp }}/csharpdb-previous-release-performance/${{ github.sha }}/pass-${{ matrix.qualification_pass }}
          PREVIOUS_RELEASE_REF: ${{ inputs.previous_release_ref }}
          CANDIDATE_REF: ${{ inputs.release_commit || github.sha }}
        run: |
          # Balanced-pair, same-revision/shared-artifact, and exact-scenario
          # controls remain diagnostics. The release gate uses one warmup plus
          # three recorded runs per revision; pass two reverses revision order.
          ./tests/CSharpDB.Benchmarks/scripts/Test-PreviousReleasePerformance.ps1 `
            -PreviousRef $env:PREVIOUS_RELEASE_REF `
            -CandidateRef $env:CANDIDATE_REF `
            -OutputPath $env:PERFORMANCE_OUTPUT `
            -QualificationPass ${{ matrix.qualification_pass }} `
            -RepeatCount 3 `
            -PostBuildQuiescenceSeconds 30 `
            -MaxThroughputRegressionPercent 15 `
            -MaxP99RegressionPercent 25 `
            -MaxP99RegressionMilliseconds 0.05

      - name: Upload previous-release performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: previous-release-performance-${{ github.sha }}-pass-${{ matrix.qualification_pass }}
          path: |
            ${{ runner.temp }}/csharpdb-previous-release-performance/${{ github.sha }}/pass-${{ matrix.qualification_pass }}/previous-release-performance-preflight.md
            ${{ runner.temp }}/csharpdb-previous-release-performance/${{ github.sha }}/pass-${{ matrix.qualification_pass }}/previous-release-performance.md
            ${{ runner.temp }}/csharpdb-previous-release-performance/${{ github.sha }}/pass-${{ matrix.qualification_pass }}/baseline-results
            ${{ runner.temp }}/csharpdb-previous-release-performance/${{ github.sha }}/pass-${{ matrix.qualification_pass }}/candidate-results
            ${{ runner.temp }}/csharpdb-previous-release-performance/${{ github.sha }}/pass-${{ matrix.qualification_pass }}/logs
          if-no-files-found: warn
          retention-days: 14
